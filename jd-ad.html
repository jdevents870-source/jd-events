<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JD Event Management</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060B;--gold:#C9A24B;--gl:#F3E7C4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);overflow-x:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;transition:opacity .9s ease}
body.past-intro #c{opacity:.22}
.logo{position:fixed;left:50%;top:39%;width:min(46vh,78vw);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;opacity:0;filter:drop-shadow(0 0 26px rgba(201,162,75,.4));z-index:2}
.cap{position:fixed;left:6vw;right:6vw;top:34%;text-align:center;color:var(--gl);font:600 clamp(26px,5.4vw,56px)/1.35 'Cairo',system-ui,sans-serif;text-shadow:0 2px 24px #000;opacity:0;pointer-events:none;z-index:2}
#bar{position:fixed;top:env(safe-area-inset-top,0px);right:0;height:2px;width:0;background:var(--gold);z-index:5}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 5vh);text-align:center;color:var(--gl);font:400 16px 'Cairo',sans-serif;z-index:4;pointer-events:none;mix-blend-mode:screen}
#hint i{display:block;width:12px;height:12px;margin:10px auto 0;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg);animation:b 1.6s ease-in-out infinite}
@keyframes b{50%{transform:translateY(8px) rotate(45deg)}}

/* ====== معرض الصور الفخم ====== */
.gallery{position:relative;z-index:3;margin-top:-10vh;contain:layout paint}
.stage{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:8vh 5vw;overflow:hidden;perspective:1500px}
.stage__halo{position:absolute;top:50%;left:50%;width:min(72vmin,820px);height:min(72vmin,820px);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(201,162,75,.20) 0%,rgba(243,231,196,.10) 40%,rgba(243,231,196,0) 74%);filter:blur(14px);pointer-events:none;animation:halo 9s ease-in-out infinite alternate;will-change:transform,opacity}
@keyframes halo{from{opacity:.62;transform:translate(-50%,-50%) scale(.985)}to{opacity:1;transform:translate(-50%,-50%) scale(1.16)}}
.frame{position:relative;width:min(94vw,1360px);aspect-ratio:16/9;margin:0;border-radius:24px;overflow:hidden;transform-style:preserve-3d;will-change:transform;box-shadow:0 70px 160px -60px rgba(201,162,75,.52),0 120px 220px -120px rgba(0,0,0,.96),0 0 0 1px rgba(201,162,75,.34),0 0 140px -40px rgba(201,162,75,.28);isolation:isolate;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.frame::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 120% at 50% 0%,rgba(243,231,196,.16) 0%,rgba(243,231,196,0) 58%);mix-blend-mode:screen;pointer-events:none}
.frame img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.08) contrast(1.02);will-change:transform;transform:scale(1.02);transition:transform .28s cubic-bezier(.22,.61,.36,1);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.frame.is-reveal{animation:frame-in 1.24s cubic-bezier(.25,.82,.25,1) both}
@keyframes frame-in{from{opacity:0;transform:translateY(10vh) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.frame[data-tilt]:hover img{transform:scale(1.05)}
/* ====== جدار الصور المتحرك: أعمدة تتحرك باستمرار + ميلان 3D يتبع الماوس ====== */
.wall{position:relative;z-index:3;width:min(96vw,1320px);margin:clamp(6vh,14vw,16vh) auto clamp(16vh,24vw,26vh);padding:0 clamp(2vw,5vw,6vw);perspective:1600px}
.wall__wrap{position:relative;height:min(108vh,860px);overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 13%,#000 87%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 13%,#000 87%,transparent 100%);transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .55s cubic-bezier(.22,.61,.36,1);will-change:transform}
.wall__row{display:flex;align-items:flex-start;gap:clamp(.6rem,1.5vw,1.15rem);transform:translate3d(0,calc(var(--shift,0)*1px),0);will-change:transform}
.wall__col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;animation:wallUp var(--dur,32s) linear infinite;will-change:transform}
.wall__col--rev{animation-direction:reverse}
.wall__col:hover{animation-play-state:paused}
@keyframes wallUp{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,-50%,0)}}
.wall__card{position:relative;display:block;margin:0 0 clamp(.6rem,1.5vw,1.15rem);border-radius:18px;overflow:hidden;background:#0A0E18;opacity:0;transform:translateY(18px) scale(.98);box-shadow:0 34px 80px -46px #000,0 0 54px -30px rgba(201,162,75,.30);transition:opacity .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1),box-shadow .45s ease;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.wall__card::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(201,162,75,.22);pointer-events:none;z-index:3}
.wall__card::before{content:"";position:absolute;inset:0;background:radial-gradient(130% 130% at 50% 0%,rgba(243,231,196,.16) 0%,rgba(243,231,196,0) 56%);mix-blend-mode:screen;pointer-events:none;z-index:2}
.wall__card img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.05);transition:transform .6s cubic-bezier(.22,.61,.36,1);filter:saturate(1.05) contrast(1.02)}
.wall__card.in{opacity:.86;transform:translateY(0) scale(1)}
.wall__card.in:hover{opacity:1;transform:translateY(-6px) scale(1.015);box-shadow:0 46px 92px -46px #000,0 0 72px -28px rgba(201,162,75,.46);z-index:4}
.wall__card.in:hover img{transform:scale(1.11)}
.wall__card--a{aspect-ratio:16/10}
.wall__card--b{aspect-ratio:4/3}
@media(max-width:980px){.wall__wrap{height:min(104vh,760px)}.wall__col:nth-child(3){display:none}.wall__card--b{aspect-ratio:16/11}}
@media(prefers-reduced-motion:reduce){#hint i{animation:none}.frame,.wall__card{animation:none !important;transition:none !important;transform:none !important}.frame img,.wall__card img{transform:none !important;transition:none !important}.wall__col{animation:none !important}.wall__card{opacity:.9 !important}.stage__halo{animation:none}}
</style>
</head>

<script>
var cv=document.getElementById('c'),x=cv.getContext('2d'),lg=document.getElementById('lg'),bar=document.getElementById('bar'),hint=document.getElementById('hint'),
caps=[k1,k2,k3],W,H,D,cell=11,s=0,ts=0,wall={},pts=[],calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function ease(k){return k*k*(3-2*k)}
function seg(a,b){return ease(Math.min(1,Math.max(0,(s-a)/(b-a))))}
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);
cell=W<600?14:11;var w=Math.min(W*.86,920);wall={w:w,h:H*.5,cols:Math.floor(w/cell),rows:Math.floor(H*.5/cell),cy:H*.39};
pts=[];for(var i=0;i<80;i++)pts.push({x:Math.random()*W,y:Math.random()*H,v:.15+Math.random()*.4,r:.6+Math.random()*1.6})}
addEventListener('resize',function(){rs();if(calm)frame()});
if(calm)addEventListener('scroll',frame);

function frame(){
/* مدة انميشن المقدمة = مساحة التمرير (260vh) نفسها */
var introMax=Math.max(1,innerHeight*2.6);
ts=Math.min(1,Math.max(0,scrollY/introMax));
s=calm?ts:s+(ts-s)*.08;
x.globalCompositeOperation='source-over';
var g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#070B16');g.addColorStop(.7,'#05070D');g.addColorStop(1,'#020307');
x.fillStyle=g;x.fillRect(0,0,W,H);

/* 1: LED wall boots up pixel by pixel, camera pushes in, then pulls back */
var boot=seg(0,.22),z=1+1.7*seg(.12,.4)-1.15*seg(.72,.95),wd=1-.75*seg(.42,.58)+.75*seg(.78,.92);
var cs=cell*z,x0=W/2-wall.cols*cs/2,y0=wall.cy-wall.rows*cs/2;
x.fillStyle='rgba(12,19,34,'+(.95*Math.min(1,boot*3))+')';x.fillRect(x0,y0,wall.cols*cs,wall.rows*cs);
for(var r=0;r<wall.rows;r++){var py=y0+r*cs;if(py>H||py+cs<0)continue;
for(var c=0;c<wall.cols;c++){var px=x0+c*cs;if(px>W||px+cs<0)continue;
var h=Math.sin(c*12.9898+r*78.233)*43758.5453;h-=Math.floor(h);
if(h>boot*1.4-c/wall.cols*.4)continue;
var v=.5+.5*Math.sin(c*.22+r*.12+s*40);
x.fillStyle='rgba('+(190+v*53|0)+','+(150+v*80|0)+','+(70+v*110|0)+','+((.08+.4*v)*wd).toFixed(2)+')';
x.fillRect(px+1,py+1,cs-2,cs-2)}}
x.strokeStyle='rgba(201,162,75,'+(.5*boot*wd)+')';x.lineWidth=1.5;x.strokeRect(x0,y0,wall.cols*cs,wall.rows*cs);

/* 2: stage lights sweep, gold dust */
x.globalCompositeOperation='lighter';
var lb=seg(.18,.34),sw=Math.sin(s*14);
for(var i=0;i<5;i++){var ox=W*(.1+.2*i),tx=W*(.1+.2*i)+sw*W*.16*(i-2)+(i-2)*W*.05,ty=H*.82,sp=W*.05;
var bg=x.createLinearGradient(ox,0,tx,ty);bg.addColorStop(0,'rgba(243,231,196,'+.22*lb+')');bg.addColorStop(1,'rgba(243,231,196,0)');
x.fillStyle=bg;x.beginPath();x.moveTo(ox-6,0);x.lineTo(ox+6,0);x.lineTo(tx+sp,ty);x.lineTo(tx-sp,ty);x.fill()}
for(var j=0;j<pts.length;j++){var p=pts[j];p.y-=p.v*(1+seg(.6,.8)*2);if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
x.fillStyle='rgba(243,214,140,'+(.25+p.r*.2)+')';x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
x.globalCompositeOperation='source-over';

/* 3: conference audience rises from below */
var au=seg(.34,.52)*(1-.85*seg(.9,1));
for(var rw=0;rw<4;rw++){var sz=13+rw*8,y=H*(.76+rw*.065)+(1-au)*H*.5,off=-(s*(rw+1)*160);
x.fillStyle='rgb('+(18-rw*5)+','+(24-rw*6)+','+(38-rw*9)+')';
for(var hx=-sz*2+(off%(sz*2.1));hx<W+sz*2;hx+=sz*2.1){var by=y+Math.sin(hx*.7+rw)*3;
x.beginPath();x.arc(hx,by,sz*.5,0,6.283);x.fill();
x.beginPath();x.ellipse(hx,by+sz*1.35,sz*.95,sz*.85,0,Math.PI,0);x.fill();
x.fillRect(hx-sz*.95,by+sz*1.35,sz*1.9,H)}}

/* 4: gold ring closes around the logo */
var rg=seg(.8,.97),lr=Math.min(H*.46,W*.78)*.62;
if(rg>0){x.strokeStyle='rgba(201,162,75,'+(.9*rg)+')';x.lineWidth=2;x.beginPath();x.arc(W/2,wall.cy,lr,-Math.PI/2,-Math.PI/2+rg*6.283);x.stroke();
x.globalCompositeOperation='lighter';var gl=x.createRadialGradient(W/2,wall.cy,0,W/2,wall.cy,lr*1.6);gl.addColorStop(0,'rgba(243,214,140,'+.2*seg(.88,1)+')');gl.addColorStop(1,'rgba(243,214,140,0)');
x.fillStyle=gl;x.fillRect(0,0,W,H);x.globalCompositeOperation='source-over'}

/* logo + captions */
var o=Math.max(seg(.02,.14)*(1-seg(.4,.5)),seg(.8,.92));
lg.style.opacity=o;
lg.style.transform='translate(-50%,-50%) scale('+(1+.3*seg(.1,.4)+.1*seg(.8,1))+') perspective(900px) rotateY('+(Math.sin(s*9)*10)+'deg)';
var w=[[.44,.58],[.58,.7],[.7,.8]];
for(var k=0;k<3;k++){var a=w[k][0],b=w[k][1],q=seg(a,a+.04)*(1-seg(b-.04,b));caps[k].style.opacity=q;caps[k].style.transform='translateY('+((1-q)*24)+'px)'}
bar.style.width=(ts*100)+'%';hint.style.opacity=1-seg(0,.03);
if(!calm&&!paused)requestAnimationFrame(frame)}

/* ====== يخفت ستارة المقدمة لمّا يبدأ المعرض ====== */
var paused=false;
new IntersectionObserver(function(es){
es.forEach(function(e){
document.body.classList.toggle('past-intro',e.isIntersecting);
if(e.isIntersecting){paused=true}
else if(paused){paused=false;if(!calm)requestAnimationFrame(frame)}
});
},{threshold:.12}).observe(document.querySelector('.gallery'));

/* ====== Fancy image tilt + scroll reveal (elegant, no ad feel) ====== */
(function(){
if(calm)return;
var maxTilt=9;
document.querySelectorAll('[data-tilt]').forEach(function(el){
var raf=null,targetRX=0,targetRY=0,curRX=0,curRY=0,img=el.querySelector('img');
function lerp(a,b,t){return a+(b-a)*t}
function anim(){
curRX=lerp(curRX,targetRX,.12);
curRY=lerp(curRY,targetRY,.12);
el.style.transform='rotateX('+curRX+'deg) rotateY('+curRY+'deg) translateZ(18px)';
if(img) img.style.transform='scale(1.052) translate3d('+(-targetRY*.8)+'px,'+(-targetRX*.6)+'px,8px)';
raf=requestAnimationFrame(anim);
}
el.addEventListener('mousemove',function(e){
var r=el.getBoundingClientRect();
var x=(e.clientX-r.left)/r.width-.5;
var y=(e.clientY-r.top)/r.height-.5;
targetRY=-x*maxTilt;
targetRX=y*maxTilt;
if(!raf) raf=requestAnimationFrame(anim);
},{passive:true});
el.addEventListener('mouseleave',function(){
targetRX=0;targetRY=0;
if(!raf) raf=requestAnimationFrame(anim);
setTimeout(function(){if(targetRX===0&&targetRY===0){cancelAnimationFrame(raf);raf=null;el.style.transform='rotateX(0) rotateY(0) translateZ(0)';if(img) img.style.transform='scale(1.02)';}},160);
});
el.addEventListener('touchstart',function(){el.style.transform='rotateX(0) rotateY(0) translateZ(6px)';},{passive:true});
el.addEventListener('touchend',function(){el.style.transform='rotateX(0) rotateY(0) translateZ(0)';},{passive:true});
});
var reveal=new IntersectionObserver(function(es){
es.forEach(function(ent){
if(!ent.isIntersecting)return;
var el=ent.target;
reveal.unobserve(el);
if(el.classList.contains('wall__card')){el.classList.add('in');return}
el.classList.add('in-view');
var done=function(){el.classList.remove('is-reveal','in-view');el.removeEventListener('transitionend',done);el.removeEventListener('animationend',done);};
el.addEventListener('transitionend',done);
el.addEventListener('animationend',done);
setTimeout(done,1800);
});
},{threshold:.16,rootMargin:'0px 0px -8% 0px'});
/* تكرار مجموعات الصور تلقائياً => حركة لا نهائية بلا فراغ على كل المقاسات */
(function(){
var wrap=document.getElementById('wallWrap');
var wrapH=wrap?wrap.clientHeight:0;
document.querySelectorAll('.wall__col').forEach(function(col){
if(getComputedStyle(col).display==='none')return;
var base=[].slice.call(col.children);
if(!base.length)return;
var mb=parseFloat(getComputedStyle(base[0]).marginBottom)||0;
var setH=0;
base.forEach(function(n){setH+=n.getBoundingClientRect().height+mb});
var speed=parseFloat(col.getAttribute('data-speed'))||26;
var k=setH>0?Math.max(1,Math.ceil((wrapH+200)/setH)):2;
for(var i=1;i<k*2;i++){
base.forEach(function(n){
var m=n.cloneNode(true);
m.classList.remove('in');
m.setAttribute('aria-hidden','true');
var im=m.querySelector('img');if(im)im.setAttribute('alt','');
col.appendChild(m);
});
}
if(setH>0)col.style.setProperty('--dur',(k*setH/speed).toFixed(1)+'s');
});
})();
document.querySelectorAll('.wall__col').forEach(function(col){
[].slice.call(col.children).forEach(function(c,i){
c.style.transitionDelay=(i*.07).toFixed(2)+'s';
setTimeout(function(){c.style.transitionDelay='0s'},900+i*70);
});
});
document.querySelectorAll('.wall__card').forEach(function(el){reveal.observe(el);});
var fr=document.querySelector('.frame[data-reveal]');
if(fr){reveal.observe(fr);}

/* ====== الجدار: ميلان 3D يتبع الماوس + انزياح مع السكرول ====== */
(function(){
var wall=document.getElementById('wall'),wrap=document.getElementById('wallWrap'),row=document.getElementById('wallRow');
if(!wall||!wrap||!row)return;
var tRX=0,tRY=0,cRX=0,cRY=0,sh=0,tsh=0,raf=null;
function loop(){
cRX+=(tRX-cRX)*.08;cRY+=(tRY-cRY)*.08;sh+=(tsh-sh)*.08;
wrap.style.setProperty('--rx',cRX.toFixed(2)+'deg');
wrap.style.setProperty('--ry',cRY.toFixed(2)+'deg');
row.style.setProperty('--shift',sh.toFixed(1));
if(Math.abs(tRX-cRX)<.02&&Math.abs(tRY-cRY)<.02&&Math.abs(tsh-sh)<.15){raf=null;return}
raf=requestAnimationFrame(loop);
}
function kick(){if(!raf)raf=requestAnimationFrame(loop)}
wall.addEventListener('mousemove',function(e){
var r=wall.getBoundingClientRect();
var x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
tRY=-x*7;tRX=y*5;kick();
},{passive:true});
wall.addEventListener('mouseleave',function(){tRX=0;tRY=0;kick()});
function onScroll(){
var r=wall.getBoundingClientRect();
var p=(innerHeight/2-(r.top+r.height/2))/innerHeight;
p=Math.max(-1,Math.min(1,p));
tsh=-80+p*60;
kick();
}
addEventListener('scroll',onScroll,{passive:true});
onScroll();
})();
})();

rs();frame();
</script>
